# Reverse proxy to the Node/Express API (PM2-managed, listening on 127.0.0.1:4000
# — never expose that port directly to the internet, only through this proxy).

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    client_max_body_size 6m;   # a little above the 5MB upload limit in multer

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSLCommerz/bKash post back here and Meta webhooks retry aggressively —
        # give the upstream a reasonable window rather than Nginx's 60s default.
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
