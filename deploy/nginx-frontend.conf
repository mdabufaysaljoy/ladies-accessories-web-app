# Static React build — served directly by Nginx, no Node process involved.
# Certbot will rewrite this file to add the SSL server block; run certbot
# AFTER this file is in place (see DEPLOY.md).

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/goods-by-sadia/dist;
    index index.html;

    # gzip the text-ish assets Vite emits
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames (index-XXXX.js) — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path resolves to index.html so React Router
    # handles it client-side, instead of Nginx 404ing on a deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.svg {
        expires 30d;
    }
}
